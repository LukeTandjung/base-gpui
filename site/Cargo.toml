[workspace]

[package]
name = "showcase"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "showcase"
path = "src/main.rs"

[dependencies]
base-gpui = { path = ".." }
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "1764c2fa6776c545ece60357e0e6dd9856a241bc" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1764c2fa6776c545ece60357e0e6dd9856a241bc" }

# Browsers budget executable memory for compiled wasm per process; the default
# release profile produced a ~20 MB module that OOMed stricter engines once a
# couple of pages had instantiated it. Size-focused codegen keeps the module
# small enough to compile everywhere (wasm-opt can't help — it breaks
# shared-memory builds, see data-wasm-opt="0" in index.html).
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }
# Zed's workspace pins 0.2.120; newer wasm-bindgen glue (tested with 0.2.126)
# breaks GPUI's web closures at runtime ("closure invoked recursively or
# after being dropped" on the first frame).
wasm-bindgen = "=0.2.120"
