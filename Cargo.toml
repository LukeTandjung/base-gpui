[package]
name = "base-gpui"
version = "0.1.0"
edition = "2021"
authors = ["Luke Tandjung"]
description = "A GPUI-native port of Base UI's rich, headless component APIs"
license = "MIT"
repository = "https://github.com/LukeTandjung/base-gpui"
readme = "README.md"
keywords = ["gpui", "ui", "components", "desktop", "unstyled"]
categories = ["gui"]
publish = false

[dependencies]
derive_setters = "0.1.9"
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "59b2ebf10351b5c0b5cd4403f01ed0460eeec06d" }
unicode-segmentation = "1"
# std::time::{Instant, SystemTime} panic on wasm32-unknown-unknown ("time not
# implemented on this platform"). web-time re-exports the std types unchanged
# on native targets and swaps in performance.now()/Date.now()-backed
# implementations on the web, so runtimes can keep passing plain Instants.
web-time = "1"

[dev-dependencies]
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "59b2ebf10351b5c0b5cd4403f01ed0460eeec06d", features = ["test-support"] }

[lints.clippy]
large_enum_variant = "allow"
pub_with_shorthand = "deny"
too_many_arguments = "allow"
